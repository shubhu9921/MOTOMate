spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://localhost:3306/motormate
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.platform=mysql
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:MotorMateSuperSecretKeyForLocalDevelopmentOnly12345!}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT:5}
app.rate-limit.login.window-minutes=${LOGIN_RATE_WINDOW:15}
app.rate-limit.register.capacity=${REGISTER_RATE_LIMIT:3}
app.rate-limit.register.window-minutes=${REGISTER_RATE_WINDOW:60}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v17.0}
app.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
