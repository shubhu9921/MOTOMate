spring.application.name=backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/MotorMate
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MotorMateSuperSecretKeyForLocalDevelopmentOnly12345!}
app.jwt.expiration-ms=86400000

# Security Configurations
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.tomcat.max-http-form-post-size=${MAX_POST_SIZE:5MB}

# Rate Limiting
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT:5}
app.rate-limit.login.window-minutes=${LOGIN_RATE_WINDOW:15}
app.rate-limit.register.capacity=${REGISTER_RATE_LIMIT:3}
app.rate-limit.register.window-minutes=${REGISTER_RATE_WINDOW:60}
