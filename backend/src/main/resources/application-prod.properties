spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (Production)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration (Production Safe)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# MUST BE SUPPLIED VIA ENVIRONMENT VARIABLE
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Security Configurations
# MUST LIMIT ORIGINS IN PRODUCTION
app.cors.allowed-origins=${CORS_ORIGINS:https://motormate.in}
server.tomcat.max-http-form-post-size=5MB

# Rate Limiting
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT:10}
app.rate-limit.login.window-minutes=${LOGIN_RATE_WINDOW:15}
app.rate-limit.register.capacity=${REGISTER_RATE_LIMIT:5}
app.rate-limit.register.window-minutes=${REGISTER_RATE_WINDOW:60}

# WhatsApp Business API Configuration
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
