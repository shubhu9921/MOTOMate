spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (Production - Supabase PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Enforce SSL for production database
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration (Production Safe)
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.platform=postgresql
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
# MUST BE SUPPLIED VIA ENVIRONMENT VARIABLE
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Security Configurations
# MUST LIMIT ORIGINS IN PRODUCTION
app.cors.allowed-origins=${CORS_ORIGINS:https://revora.netlify.app,http://localhost:5173,http://localhost:8080}
server.tomcat.max-http-form-post-size=5MB

# Rate Limiting
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT:10}
app.rate-limit.login.window-minutes=${LOGIN_RATE_WINDOW:15}
app.rate-limit.register.capacity=${REGISTER_RATE_LIMIT:5}
app.rate-limit.register.window-minutes=${REGISTER_RATE_WINDOW:60}

# WhatsApp Business API Configuration
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v17.0}
app.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}



# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
