spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (Supabase PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.aljhrxxcdayhoovddhcu}
spring.datasource.password=${DB_PASSWORD:REPLACE_WITH_YOUR_ACTUAL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MotorMateSuperSecretKeyForLocalDevelopmentOnly12345!}
app.jwt.expiration-ms=86400000

# Security Configurations
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.tomcat.max-http-form-post-size=${MAX_POST_SIZE:5MB}

# Rate Limiting
app.rate-limit.login.capacity=${LOGIN_RATE_LIMIT:5}
app.rate-limit.login.window-minutes=${LOGIN_RATE_WINDOW:15}
app.rate-limit.register.capacity=${REGISTER_RATE_LIMIT:3}
app.rate-limit.register.window-minutes=${REGISTER_RATE_WINDOW:60}

# WhatsApp Business API Configuration
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v17.0}
app.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
